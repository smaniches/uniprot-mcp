repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Linter revs AND the mypy type-stub deps are kept in lockstep with
  # constraints/dev.lock so a contributor's local `pre-commit run` enforces
  # the same versions the CI lint job pins. Bump these together with the lock.
  #
  # This is ENFORCED, not just documented: the check-precommit-lockstep hook
  # below and tests/contract/test_precommit_lockstep.py both fail on drift,
  # and dev-lock-maintenance.yml runs the same script with --fix so a monthly
  # lock refresh realigns these revs in the same PR.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        files: ^src/uniprot_mcp/.*\.py$
        args: ["src/uniprot_mcp"]
        pass_filenames: false
        additional_dependencies: ["httpx==0.28.1", "mcp==1.29.0"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ["--ignore-words-list=nd,te,hsa"]

  # Local hook: keep every version-bearing file in lockstep with
  # pyproject.toml's [project].version. Catches drift before push;
  # the same script is also enforced in CI via the contract test
  # tests/contract/test_version_consistency.py.
  - repo: local
    hooks:
      - id: check-versions
        name: check-versions (pyproject is canonical)
        entry: python scripts/check_versions.py
        language: system
        pass_filenames: false
        files: |
          (?x)^(
            pyproject\.toml
            |CITATION\.cff
            |server\.json
            |\.well-known/mcp\.json
            |tests/unit/test_client_mutation_killers\.py
          )$

      # Keep this file's pinned hook versions equal to constraints/dev.lock,
      # so local `pre-commit run` and the CI lint job execute the same ruff,
      # mypy, bandit and mypy stub versions. Enforced in CI too, via
      # tests/contract/test_precommit_lockstep.py.
      - id: check-precommit-lockstep
        name: check-precommit-lockstep (dev.lock is canonical)
        entry: python scripts/check_precommit_lockstep.py
        language: system
        pass_filenames: false
        files: |
          (?x)^(
            \.pre-commit-config\.yaml
            |constraints/dev\.lock
          )$

      # constraints/mutation.lock is excluded from scripts/regenerate-locks.sh
      # (resolving it builds sdists), so the CI regenerate-and-diff gate cannot
      # catch it drifting from its input. Compare them directly instead; this
      # resolves nothing. Also enforced in CI via the `lock` job and
      # tests/contract/test_mutation_lock_sync.py.
      - id: check-mutation-lock-sync
        name: check-mutation-lock-sync (mutation.in vs mutation.lock)
        entry: python scripts/check_mutation_lock_sync.py
        language: system
        pass_filenames: false
        files: |
          (?x)^(
            constraints/mutation\.in
            |constraints/mutation\.lock
          )$
