version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      # Pin the run to a predictable local hour. With no time/timezone,
      # Dependabot fires at its default slot in UTC (~04:40 UTC), which lands
      # in the middle of the night for the maintainer. NOTE: adjust `timezone`
      # to your actual IANA zone if America/New_York is not yours.
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    # Dependabot manages the DIRECT deps declared in pyproject.toml only.
    #
    # Everything under constraints/ is a DERIVED uv lock (dev, test, docs,
    # release, mutation, and the uv bootstrap). Dependabot's pip parser would
    # treat every pinned line in them as a top-level requirement (the `# via`
    # annotations are comments, not a dependency graph it understands), so it
    # cannot distinguish transitive pins (msgpack, pydantic-core, ...) from real
    # direct deps. `allow: dependency-type: direct` therefore does NOT exclude
    # them — confirmed in production: closed PR #109 still bumped 6 transitive
    # pins and failed the "Dev lock in sync" gate. Two things keep the locks out
    # of Dependabot's reach instead:
    #   1. they are named *.lock (not *.txt), so the pip file fetcher does
    #      not parse them as requirements files at all; and
    #   2. exclude-paths skips the constraints/ directory before manifest
    #      parsing, as a second, explicit layer. This also covers the *.in
    #      compile inputs, which pip WOULD otherwise parse.
    # Transitive pins advance via .github/workflows/dev-lock-maintenance.yml.
    # Trade-off: because the lock is hidden from Dependabot, its transitive pins
    # get NO Dependabot security PRs either — they refresh on that workflow's
    # schedule (or on-demand via workflow_dispatch for an urgent CVE). Accepted
    # because the lock is CI/dev-only: the shipped package pins only httpx>=0.27
    # / mcp>=1.2 (covered by Dependabot alerts) and end users resolve transitives
    # fresh at install, so they are never pinned to this lock's versions.
    #
    # Caveat: if Dependabot ever raises a pyproject floor above the pinned
    # version, it edits pyproject but not the excluded locks, so CI's "Dev lock in
    # sync" gate goes red. Remedy: regenerate the locks onto that PR (run
    # dev-lock-maintenance, or `scripts/regenerate-locks.sh`).
    # Rare with the >= floors here, which Dependabot leaves alone.
    exclude-paths:
      - "constraints/**"
    groups:
      runtime:
        patterns: ["httpx", "mcp"]
        # Runtime major upgrades are architectural changes, not routine
        # maintenance. In particular, mcp 2.x removes APIs used by server.py.
        update-types:
          - "minor"
          - "patch"
      dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "hypothesis"
          - "respx"
          - "syrupy"
          - "bandit"
          - "pip-audit"
          - "pre-commit"
          - "interrogate"
      docs:
        patterns: ["mkdocs*"]
      # Catch unmatched routine updates without absorbing major upgrades that
      # require explicit compatibility review into an unrelated grouped PR.
      other:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    ignore:
      # pyproject.toml and contract tests deliberately enforce mcp<2. A 2.x
      # migration requires a coordinated server API port and must never arrive
      # as routine dependency maintenance that widens the compatibility ceiling.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      # Batch all action bumps into a single weekly PR instead of one each
      # (previously actions/checkout, release-drafter and action-gh-release
      # arrived as three separate PRs in the same run).
      actions:
        patterns: ["*"]
    ignore:
      # release-drafter v7.x has a regression on the pull_request trigger
      # path: it sends `targetCommitish: refs/pull/N/merge` to GitHub's
      # update-release API, which is rejected with "Validation Failed:
      # target_commitish invalid". Tracked upstream at
      # https://github.com/release-drafter/release-drafter/issues/1125
      # (open since 2022-04-21). We are on v7.2.0 with the workflow's
      # `pull_request` trigger removed (commit f98f08cc) — the
      # `push:branches:[main]` path is the only one we ship from, and
      # it works correctly. Block further v8+ majors until a fix lands
      # so we don't get re-bitten on a routine bump; minors and patches
      # of v7 are still allowed.
      - dependency-name: "release-drafter/release-drafter"
        update-types: ["version-update:semver-major"]
