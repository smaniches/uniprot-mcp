name: Immediate release verification

# Verifies PyPI identity and downloaded artifact SHA-256, GitHub Release
# assets, SLSA provenance, and SBOM-to-wheel binding. Zenodo is deliberately
# handled by the separate delayed reconciliation workflow.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (e.g. v1.3.2)"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PYPI_NAME: "uniprot-mcp-server"
    steps:
      - name: Derive plain version from tag
        id: version
        run: |
          v="${TAG#v}"
          v="${v#.}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Verifying immediate release links for version: $v"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify PyPI publish
        id: pypi
        env:
          VERIFY_VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/verify_pypi_release.py "$PYPI_NAME" "$VERIFY_VERSION"

      - name: Verify GitHub Release assets
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Assets:"
          echo "$assets"
          grep -q "sbom.cdx.json" <<< "$assets" || { echo "missing sbom.cdx.json"; exit 1; }
          grep -qE "\.sigstore(\.json)?$" <<< "$assets" || { echo "missing sigstore bundle"; exit 1; }
          grep -qE "\.whl$" <<< "$assets" || { echo "missing wheel"; exit 1; }
          grep -qE "\.tar\.gz$" <<< "$assets" || { echo "missing sdist"; exit 1; }

      - name: Verify SLSA build provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/relverify
          cd /tmp/relverify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.whl'
          for whl in *.whl; do
            echo "verifying provenance for $whl"
            gh attestation verify "$whl" --repo "$GITHUB_REPOSITORY"
          done

      - name: Verify SBOM binds to the released wheel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p /tmp/sbomverify
          cd /tmp/sbomverify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.whl' --pattern 'sbom.cdx.json'
          wheels=(*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "expected exactly one released wheel, found ${#wheels[@]}"
            exit 1
          fi
          python "$GITHUB_WORKSPACE/scripts/bind_release_sbom.py" \
            --verify-only --sbom sbom.cdx.json --wheel "${wheels[0]}"

      - name: Open release-drift issue on immediate failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const tag = process.env.TAG;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Release verification failed for ${tag}`;
            const body = [
              `Immediate release verification (\`release-verify.yml\`) failed for tag \`${tag}\`.`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `One or more of {PyPI, GitHub Release assets, SLSA provenance, SBOM binding}`,
              `failed verification. Inspect the failing step and repair the release chain`,
              `before the next tag. Index metadata and downloaded hashes are checked`,
              `against the requested version; no pip index console output is parsed.`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: "release-drift", state: "open",
            });
            const dup = existing.data.find(i => i.title === title);
            if (!dup) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["release-drift"],
              });
            }
