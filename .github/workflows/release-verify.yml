name: Immediate release verification

# Fires after a GitHub Release is published (by release.yml or by
# manual creation). Confirms the release links that should settle
# immediately:
#
#   1. PyPI                  — `pip index versions` returns the tag
#   2. GitHub Release assets — sdist + wheel + sigstore + sbom present
#   3. Provenance            — `gh attestation verify` passes against the
#                              wheel with --repo smaniches/uniprot-mcp
#   4. SBOM binding          — the released sbom.cdx.json root still equals
#                              SHA-256(released wheel), so a post-release
#                              asset swap cannot go unnoticed
#
# Zenodo publication is asynchronous and is deliberately not part of this
# immediate gate. `.github/workflows/zenodo-verify.yml` reconciles the latest
# release only after a minimum age, so ordinary webhook propagation does not
# create a stale release-drift issue.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (e.g. v1.3.2)"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PYPI_NAME: "uniprot-mcp-server"
    steps:
      - name: Derive plain version from tag
        id: version
        # Tags are normally `v1.3.2` or — historically, for the
        # provenance-chain quirk in v1.1.5 — `v.1.1.5`. Strip both prefixes.
        run: |
          v="${TAG#v}"
          v="${v#.}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Verifying immediate release links for version: $v"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify PyPI publish
        id: pypi
        run: |
          set -euo pipefail
          # `pip index versions` lists every published version. Capture its
          # complete output before matching so an early-exiting grep cannot
          # SIGPIPE the producer under `set -o pipefail`. Escape the dots in
          # the version so the regular expression matches the literal token.
          version="${{ steps.version.outputs.version }}"
          version_re=${version//./\\.}
          for i in 1 2 3 4 5; do
            versions=$(pip index versions "$PYPI_NAME" 2>/dev/null || true)
            if grep -E "(^|[^0-9])${version_re}([^0-9]|$)" <<< "$versions"; then
              echo "PyPI: $PYPI_NAME $version present"
              exit 0
            fi
            echo "PyPI not ready, attempt $i/5; sleeping 30s"
            sleep 30
          done
          echo "PyPI: $PYPI_NAME $version NOT FOUND after 5 attempts"
          exit 1

      - name: Verify GitHub Release assets
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `gh release view` is preinstalled on ubuntu-latest runners.
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Assets:"
          echo "$assets"
          grep -q "sbom.cdx.json" <<< "$assets" || { echo "missing sbom.cdx.json"; exit 1; }
          grep -qE "\.sigstore(\.json)?$" <<< "$assets" || { echo "missing sigstore bundle"; exit 1; }
          grep -qE "\.whl$" <<< "$assets" || { echo "missing wheel"; exit 1; }
          grep -qE "\.tar\.gz$" <<< "$assets" || { echo "missing sdist"; exit 1; }

      - name: Verify SLSA build provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/relverify
          cd /tmp/relverify
          gh release download "$TAG" --repo ${{ github.repository }} --pattern '*.whl'
          for whl in *.whl; do
            echo "verifying provenance for $whl"
            gh attestation verify "$whl" --repo ${{ github.repository }}
          done

      - name: Verify SBOM binds to the released wheel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p /tmp/sbomverify
          cd /tmp/sbomverify
          gh release download "$TAG" --repo ${{ github.repository }} \
            --pattern '*.whl' --pattern 'sbom.cdx.json'
          wheels=(*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "expected exactly one released wheel, found ${#wheels[@]}"
            exit 1
          fi
          python "$GITHUB_WORKSPACE/scripts/bind_release_sbom.py" \
            --verify-only --sbom sbom.cdx.json --wheel "${wheels[0]}"

      - name: Open release-drift issue on immediate failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const tag = process.env.TAG;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Release verification failed for ${tag}`;
            const body = [
              `Immediate release verification (\`release-verify.yml\`) failed for tag \`${tag}\`.`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `One or more of {PyPI, GitHub Release assets, SLSA provenance, SBOM binding}`,
              `did not land within the immediate timeout. Inspect the failing step`,
              `and repair the release chain before the next tag. Zenodo is checked`,
              `separately by the delayed reconciliation workflow.`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: "release-drift", state: "open",
            });
            const dup = existing.data.find(i => i.title === title);
            if (!dup) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["release-drift"],
              });
            }
