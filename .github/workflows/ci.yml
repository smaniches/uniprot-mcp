name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev deps
        # Two steps on purpose. Every third-party artifact this job
        # executes comes from constraints/dev.lock under
        # --require-hashes, so pip refuses anything whose SHA-256 is not
        # recorded in the lock.
        #
        # --no-build-isolation is what makes the second line reach the
        # index for nothing. --no-deps alone does NOT: it skips the
        # project's runtime dependencies, but PEP 517 build isolation is
        # separate and stays on, so pip would build a temporary env and
        # download hatchling (pyproject's [build-system].requires)
        # outside --require-hashes. The backend is compiled into
        # dev.lock from constraints/build.in and installed by the line
        # above, so isolation can be switched off safely. Verified: with
        # PIP_NO_INDEX=1 this pair of commands still succeeds.
        #
        # The local install is editable because pip's non-editable
        # local install still resolves through the same code path as a
        # remote fetch. pip-audit (below) is unaffected: it audits
        # `pip freeze` output with the project itself excluded, so it
        # never sees the editable distribution.
        #
        # Regenerate the lock with scripts/regenerate-locks.sh.
        run: |
          python -m pip install --require-hashes -r constraints/dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy src/uniprot_mcp
      - name: Docstring coverage (interrogate)
        run: interrogate -c pyproject.toml src/uniprot_mcp
      - name: Bandit (security lint)
        run: bandit -r src/uniprot_mcp
      - name: pip-audit (CVE scan)
        # Exclude `uniprot-mcp-server` from the audit. On a release
        # commit the bumped version doesn't exist on PyPI yet — the
        # release.yml workflow uploads it shortly after the tag push,
        # not on the branch push that triggers this CI run — and
        # `pip-audit --strict` treats the PyPI lookup failure as an
        # error. The project's own source is already covered by
        # ruff / mypy / bandit above; pip-audit's role here is to
        # flag CVEs in third-party dependencies.
        run: |
          pip freeze --exclude uniprot-mcp-server > /tmp/audit-deps.txt
          pip-audit --strict -r /tmp/audit-deps.txt

  test:
    name: Tests (${{ matrix.os }} · Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        # Hash-verified test toolchain, then the project with build
        # isolation off so the hatchling in test.lock is used instead of
        # an unhashed copy fetched from the index (see the lint job).
        # An unconstrained `pip install -e ".[test]"` resolved to the
        # newest in-range release at run time, so it never actually
        # exercised the range floors; constraints/test.lock is refreshed
        # monthly to the newest in-range versions by
        # dev-lock-maintenance.yml, which keeps that same coverage while
        # making each individual run reproducible and hash-verified.
        run: |
          python -m pip install --require-hashes -r constraints/test.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Run offline test suite
        run: pytest tests/unit tests/property tests/client tests/contract -v --cov --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lock:
    name: Dev lock in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify constraints/ locks are in sync with pyproject.toml
        # uv reuses the committed pins as preferences, so recompiling only
        # changes a lock when its inputs changed without a refresh. uv is
        # itself installed from a hash-locked bootstrap file, so the tool
        # that generates the locks is as verifiable as the locks it emits,
        # and its pinned version is what keeps the output byte-stable
        # across runners. dev-lock-maintenance.yml calls the same script,
        # so the regenerate and verify paths cannot drift.
        run: |
          python -m pip install --require-hashes -r constraints/uv-bootstrap.lock
          ./scripts/regenerate-locks.sh
          git diff --exit-code constraints/
      - name: Verify constraints/mutation.lock satisfies its input
        # mutation.lock is excluded from the regeneration above on purpose:
        # resolving it builds mutmut's and glob2's sdists, executing
        # third-party setup.py code, which must not happen on every PR.
        #
        # That exclusion means the `git diff` gate cannot see it drift. Editing
        # the mutmut pin in constraints/mutation.in without running
        # scripts/regenerate-mutation-lock.sh would otherwise pass every check
        # while the weekly mutation run kept using the old version. This
        # comparison reads the two files and resolves nothing, so it is safe
        # to run here. Also enforced by
        # tests/contract/test_mutation_lock_sync.py.
        run: python scripts/check_mutation_lock_sync.py
