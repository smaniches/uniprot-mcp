name: One-time lock security refresh

on:
  push:
    branches: [chore/dev-lock-refresh]

permissions:
  contents: read

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile refreshed locks without executing dependency build code
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r constraints/uv-bootstrap.lock
          WORK="${RUNNER_TEMP}/lock-compile"
          mkdir -p "$WORK"
          git archive HEAD | tar -x -C "$WORK"
          ( cd "$WORK" && ./scripts/regenerate-locks.sh --upgrade )
          ( cd "$WORK" && python scripts/check_precommit_lockstep.py --fix )
          cp -r "$WORK/constraints" "${RUNNER_TEMP}/constraints-upgraded"
          cp "$WORK/.pre-commit-config.yaml" "${RUNNER_TEMP}/precommit-upgraded.yaml"
          ( cd "$WORK" && ./scripts/regenerate-locks.sh )
          diff -r "${RUNNER_TEMP}/constraints-upgraded" "$WORK/constraints"
          cmp "${RUNNER_TEMP}/precommit-upgraded.yaml" "$WORK/.pre-commit-config.yaml"
          rm -rf constraints
          cp -r "${RUNNER_TEMP}/constraints-upgraded" constraints
          cp "${RUNNER_TEMP}/precommit-upgraded.yaml" .pre-commit-config.yaml
      - name: Upload compiled lock set before executing upgraded tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-refreshed-locks
          path: |
            constraints/
            .pre-commit-config.yaml
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  validate:
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-refreshed-locks
          path: .
      - name: Validate developer/security closure
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/v-dev"
          export PATH="${RUNNER_TEMP}/v-dev/bin:${PATH}"
          python -m pip install --require-hashes -r constraints/dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          ruff check .
          ruff format --check .
          mypy src/uniprot_mcp
          interrogate -c pyproject.toml src/uniprot_mcp
          bandit -r src/uniprot_mcp
          python -m pip freeze --exclude uniprot-mcp-server > "${RUNNER_TEMP}/audit-deps.txt"
          pip-audit --strict -r "${RUNNER_TEMP}/audit-deps.txt"
      - name: Validate test closure
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/v-test"
          export PATH="${RUNNER_TEMP}/v-test/bin:${PATH}"
          python -m pip install --require-hashes -r constraints/test.lock
          python -m pip install --no-build-isolation --no-deps -e .
          pytest tests/unit tests/property tests/client tests/contract -q
      - name: Validate docs closure
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/v-docs"
          export PATH="${RUNNER_TEMP}/v-docs/bin:${PATH}"
          python -m pip install --require-hashes -r constraints/docs.lock
          python -m pip install --no-build-isolation --no-deps -e .
          mkdocs build --strict
      - name: Validate release closure
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/v-rel"
          export PATH="${RUNNER_TEMP}/v-rel/bin:${PATH}"
          python -m pip install --require-hashes -r constraints/release.lock
          python -m build --no-isolation --outdir "${RUNNER_TEMP}/dist-smoke"
          python -m pip freeze > "${RUNNER_TEMP}/rel-freeze.txt"
          cyclonedx-py requirements -o "${RUNNER_TEMP}/sbom.json" "${RUNNER_TEMP}/rel-freeze.txt"
          test -s "${RUNNER_TEMP}/sbom.json"
      - name: Validate mutation build closure
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/v-mut"
          export PATH="${RUNNER_TEMP}/v-mut/bin:${PATH}"
          python -m pip install --require-hashes -r constraints/mutation-build.lock
          python -m pip install --no-build-isolation --require-hashes -r constraints/mutation.lock
          python - <<'PY'
          import importlib.metadata as md
          import mutmut.__main__ as mm
          assert md.version("mutmut") == "2.5.1"
          assert hasattr(mm, "parse_run_argument")
          PY

  push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/dev-lock-refresh
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-refreshed-locks
          path: .
      - name: Commit validated locks and remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/lock-refresh-now.yml
          git add constraints/ .pre-commit-config.yaml .github/workflows/lock-refresh-now.yml
          git commit -m "chore(deps): refresh hash-locked toolchains to patched pins"
          git push origin HEAD:chore/dev-lock-refresh
