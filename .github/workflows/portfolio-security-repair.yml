name: Prepare targeted security lock repair
on:
  push:
    branches: [fix/portfolio-security-20261023]
    paths: [.github/workflows/portfolio-security-repair.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Resolve only the vulnerable development dependency
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r constraints/uv-bootstrap.lock
          uv pip compile pyproject.toml constraints/build.in --extra test --extra dev --universal --generate-hashes --no-emit-package pip --python-version 3.11 --no-build --upgrade-package filelock --output-file constraints/dev.lock
          bash scripts/regenerate-locks.sh > /tmp/lock-normalization.log 2>&1
          python - <<'PY'
          import pathlib,re,subprocess
          names=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert names == ['constraints/dev.lock'], names
          text=pathlib.Path('constraints/dev.lock').read_text()
          m=re.search(r'^filelock==([^\s]+)',text,re.M)
          assert m and tuple(map(int,m[1].split('.'))) >= (4,2,1), m
          print('FileLock resolved:',m[1]); print('Changed files:',names)
          PY
          mkdir payload
          cp constraints/dev.lock payload/dev.lock
          git diff --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: targeted-security-lock
          path: payload/dev.lock
          retention-days: 7
  commit:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/portfolio-security-20261023
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: targeted-security-lock
          path: payload
      - name: Commit the generated lock only
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          cp payload/dev.lock constraints/dev.lock
          git add constraints/dev.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'chore(security): patch FileLock in the development lock'
          git push origin HEAD:fix/portfolio-security-20261023
