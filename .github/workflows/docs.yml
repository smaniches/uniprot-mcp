name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mkdocs strict build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install docs dependencies
        # --no-build-isolation is required alongside --no-deps: --no-deps
        # skips runtime dependencies but leaves PEP 517 build isolation
        # on, which would download and execute an unhashed hatchling from
        # the index. docs.lock carries the backend (via
        # constraints/build.in), so nothing is fetched. This matters most
        # in the deploy job below, which holds `contents: write`.
        run: |
          python -m pip install --require-hashes -r constraints/docs.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: mkdocs build (strict)
        run: mkdocs build --strict
      - name: Upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: site
          path: site/
          retention-days: 7

  deploy:
    name: Deploy to gh-pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install docs dependencies
        # --no-build-isolation is required alongside --no-deps: --no-deps
        # skips runtime dependencies but leaves PEP 517 build isolation
        # on, which would download and execute an unhashed hatchling from
        # the index. docs.lock carries the backend (via
        # constraints/build.in), so nothing is fetched. This matters most
        # in the deploy job below, which holds `contents: write`.
        run: |
          python -m pip install --require-hashes -r constraints/docs.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Deploy via mkdocs gh-deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --remote-branch gh-pages
