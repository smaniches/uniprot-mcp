name: Delayed Zenodo verification

# Zenodo is eventually consistent with GitHub Releases. This workflow checks
# the latest stable release only after it is at least six hours old. A manual
# run naming that latest tag bypasses the age gate for operator verification.
# No workflow mints or edits Zenodo records; the GitHub-Zenodo integration does
# that automatically.
#
# The job separates two outcomes that must never share a signal:
#
#   * "verification failed" — Zenodo answered, and the answer contradicts the
#     GitHub release (or the concept record is gone). That is a release-integrity
#     problem. It fails loudly and opens a release-drift issue.
#   * "verification could not be performed" — Zenodo did not answer at all
#     (429, 5xx, timeout, a body that is not JSON). No observation was
#     obtained, so nothing is implied about the release. On the schedule this
#     is recorded as inconclusive and left green: the next run re-checks six
#     hours later. On a manual run it still fails, because an operator asked
#     for a reading and did not get one.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Latest release tag to verify immediately (optional)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  verify-zenodo:
    runs-on: ubuntu-latest
    env:
      REQUESTED_TAG: ${{ inputs.tag || '' }}
      ZENODO_CONCEPT_RECID: "19817710"
      MIN_RELEASE_AGE_HOURS: "6"
    steps:
      - name: Reconcile the latest GitHub Release with Zenodo
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const requestedTag = process.env.REQUESTED_TAG.trim();
            const minAgeHours = Number(process.env.MIN_RELEASE_AGE_HOURS);
            const conceptRecid = process.env.ZENODO_CONCEPT_RECID;

            // A scheduled run is an unattended sample of an eventually
            // consistent system; anything else is an operator asking a
            // question and waiting for the answer.
            const isScheduled = context.eventName === "schedule";

            // Statuses that describe Zenodo's availability rather than the
            // record. Retrying these is meaningful; retrying anything else
            // just repeats the same wrong request.
            const TRANSIENT_STATUSES = new Set([408, 425, 429, 500, 502, 503, 504]);
            const BACKOFF_SECONDS = [30, 60, 120];
            const MAX_ATTEMPTS = BACKOFF_SECONDS.length + 1;
            // Zenodo's edge emits its own 504 at roughly 30s. Give each read a
            // little more than that so a real gateway timeout is recorded as
            // `HTTP 504` rather than as a client-side abort, while still
            // bounding a hung connection.
            const REQUEST_TIMEOUT_MS = 45_000;

            if (!Number.isFinite(minAgeHours) || minAgeHours <= 0) {
              core.setFailed("MIN_RELEASE_AGE_HOURS must be a positive number");
              return;
            }

            const writeSummary = async (heading, lines) => {
              await core.summary
                .addHeading(heading, 3)
                .addRaw(lines.map((line) => `- ${line}`).join("\n"))
                .addEOL()
                .write();
            };

            const releaseResponse = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const release = releaseResponse.data;
            const tag = release.tag_name;

            if (requestedTag && requestedTag !== tag) {
              core.setFailed(
                `Requested tag ${requestedTag} is not the latest stable release ${tag}. ` +
                `This workflow follows the concept record's latest-version pointer.`,
              );
              return;
            }

            const publishedAt = new Date(release.published_at || release.created_at);
            const ageHours = (Date.now() - publishedAt.getTime()) / 3_600_000;

            if (!requestedTag && ageHours < minAgeHours) {
              core.notice(
                `Skipping ${tag}: release age ${ageHours.toFixed(2)}h is below ` +
                `${minAgeHours}h delayed-verification threshold.`,
              );
              return;
            }

            const expectedVersion = tag.replace(/^v\.?/, "");
            const recordUrl = `https://zenodo.org/api/records/${conceptRecid}`;

            // One read. Either the record, or a failure classified as
            // permanent (the record or the request is wrong; retrying cannot
            // help) or transient (Zenodo is unavailable; retrying can).
            const readZenodo = async () => {
              let response;
              try {
                response = await fetch(recordUrl, {
                  headers: {
                    Accept: "application/json",
                    "User-Agent": "uniprot-mcp-zenodo-verifier/1",
                  },
                  signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
                });
              } catch (error) {
                return {
                  transient: `network error or timeout (${error.message})`,
                };
              }

              if (response.status === 404 || response.status === 410) {
                return {
                  permanent:
                    `HTTP ${response.status}: concept record ${conceptRecid} is ` +
                    `missing or withdrawn`,
                };
              }
              if (!response.ok) {
                return TRANSIENT_STATUSES.has(response.status)
                  ? { transient: `HTTP ${response.status}` }
                  : { permanent: `HTTP ${response.status}` };
              }

              try {
                return { metadata: await response.json() };
              } catch (error) {
                // A 200 carrying a non-JSON body is an edge proxy serving an
                // error page, which is an availability symptom.
                return { transient: `body was not JSON (${error.message})` };
              }
            };

            let metadata;
            let lastTransient;

            for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt += 1) {
              const result = await readZenodo();

              if (result.metadata) {
                metadata = result.metadata;
                break;
              }

              if (result.permanent) {
                await writeSummary("Zenodo verification failed", [
                  `Release: \`${tag}\``,
                  `Concept record: \`${conceptRecid}\``,
                  `Zenodo response: ${result.permanent}`,
                ]);
                core.setFailed(
                  `Zenodo rejected the request for concept record ${conceptRecid} ` +
                  `(${result.permanent}). This is not an availability problem; ` +
                  `inspect the record before taking any action.`,
                );
                return;
              }

              lastTransient = result.transient;
              core.warning(
                `Zenodo request attempt ${attempt}/${MAX_ATTEMPTS} failed: ${lastTransient}`,
              );
              if (attempt < MAX_ATTEMPTS) {
                await new Promise((resolve) =>
                  setTimeout(resolve, BACKOFF_SECONDS[attempt - 1] * 1_000),
                );
              }
            }

            if (!metadata) {
              // No observation was obtained. This says nothing about the
              // release, so it must not look like drift and must not open a
              // release-drift issue.
              const lines = [
                `Release: \`${tag}\``,
                `Concept record: \`${conceptRecid}\``,
                `Attempts: ${MAX_ATTEMPTS}`,
                `Last upstream failure: ${lastTransient}`,
                `No Zenodo version was observed, so no drift is implied.`,
              ];

              if (!isScheduled) {
                await writeSummary("Zenodo verification could not be performed", lines);
                core.setFailed(
                  `Requested verification of ${tag} could not be performed: Zenodo was ` +
                  `unavailable after ${MAX_ATTEMPTS} attempts (${lastTransient}).`,
                );
                return;
              }

              await writeSummary(
                "Zenodo verification inconclusive (upstream unavailable)",
                lines,
              );
              core.warning(
                `Zenodo verification inconclusive for ${tag}: unavailable after ` +
                `${MAX_ATTEMPTS} attempts (${lastTransient}). The release is unaffected; ` +
                `the next scheduled run re-checks.`,
              );
              return;
            }

            const actualVersion = String(metadata.metadata?.version || "").replace(/^v/, "");
            const issueTitle = `Zenodo verification failed for ${tag}`;
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "release-drift",
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.title === issueTitle);

            if (actualVersion === expectedVersion) {
              core.info(
                `Zenodo concept record ${conceptRecid} latest version is ${actualVersion}; ` +
                `expected ${expectedVersion}.`,
              );
              await writeSummary("Zenodo verification passed", [
                `Release: \`${tag}\``,
                `Concept record: \`${conceptRecid}\``,
                `Observed Zenodo version: \`${actualVersion}\``,
              ]);
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: [
                    `Resolved by delayed verification for \`${tag}\`.`,
                    ``,
                    `Zenodo concept record \`${conceptRecid}\` now reports version ` +
                      `\`${actualVersion}\`.`,
                    ``,
                    `Verification run: ${runUrl}`,
                  ].join("\n"),
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              return;
            }

            const body = [
              `Delayed Zenodo verification failed for release \`${tag}\`.`,
              ``,
              `GitHub release published: ${publishedAt.toISOString()}`,
              `Release age at verification: ${ageHours.toFixed(2)} hours`,
              `Expected Zenodo version: \`${expectedVersion}\``,
              `Observed Zenodo version: \`${actualVersion || "<empty>"}\``,
              `Zenodo concept record: https://zenodo.org/records/${conceptRecid}`,
              `Verification run: ${runUrl}`,
              ``,
              `Zenodo answered, so this is an observed mismatch rather than an ` +
                `availability problem.`,
              ``,
              `The repository uses the GitHub-Zenodo integration. Do not mint a ` +
                `manual deposit or change the concept DOI badge. Inspect the integration ` +
                `delivery and the existing record before taking action.`,
            ].join("\n");

            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body,
                labels: ["release-drift"],
              });
            }

            await writeSummary("Zenodo verification failed (observed mismatch)", [
              `Release: \`${tag}\``,
              `Concept record: \`${conceptRecid}\``,
              `Expected version: \`${expectedVersion}\``,
              `Observed Zenodo version: \`${actualVersion || "<empty>"}\``,
            ]);

            core.setFailed(
              `Zenodo is at ${actualVersion || "<empty>"}; expected ${expectedVersion} ` +
              `for ${tag} after ${ageHours.toFixed(2)} hours.`,
            );
