name: One-shot exact release read-back proof
on:
  push:
    branches: [fix/pypi-readback-20261023]
    paths: [.github/workflows/portfolio-readback-proof.yml]
permissions: {}
jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Verify existing release through the corrected workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-verify.yml --repo "$GITHUB_REPOSITORY" \
            --ref fix/pypi-readback-20261023 --field tag=v1.3.13
