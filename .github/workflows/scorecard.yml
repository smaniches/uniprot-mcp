name: OpenSSF Scorecard

# Public-repo only — Scorecard's GitHub Actions integration requires
# public visibility to read repository metadata. Ships in the codebase
# so the flip from private to public requires no additional commits.
# Removed in commit 1401845 (private-repo billing); restored in this
# commit (closing PENDING_V1.md §1.4).

on:
  branch_protection_rule:
  schedule:
    - cron: "30 5 * * 1"  # Weekly Monday 05:30 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # required for SARIF upload to Code Scanning
      id-token: write          # required to publish to scorecard's Public API
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Public results: the badge on the README, plus Scorecard's
          # public-API ranking. Required for the OpenSSF Best Practices
          # gold tier.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4
        with:
          sarif_file: results.sarif
