name: Lock maintenance

# Refreshes the hash-locked toolchains under constraints/ that resolve purely
# from wheels — dev, test, docs, release, mutation-build — to the newest
# versions allowed by their inputs, realigns .pre-commit-config.yaml with the
# refreshed dev.lock, then opens a single PR.
#
# constraints/mutation.lock is NOT refreshed here. Its graph (mutmut, glob2)
# is sdist-only, so resolving it executes third-party setup.py code, which
# would break the upload-before-execution property below. It is regenerated
# deliberately via scripts/regenerate-mutation-lock.sh and reviewed by hand.
#
# constraints/uv-bootstrap.lock is deliberately NOT upgraded: uv is the tool
# that compiles every other lock, so its pinned version is what makes the
# output byte-reproducible. Bump constraints/uv.in in its own commit.
#
# Companion to .github/dependabot.yml, which is scoped to DIRECT deps. The
# locks are excluded from Dependabot, so it opens NO security PRs for their
# transitive pins. That is an accepted trade-off here, because:
#   * the locks pin CI/dev/release toolchains, not the shipped package — end
#     users get httpx>=0.27 / mcp>=1.2 from pyproject and resolve transitives
#     FRESH at install time, so they are never pinned to these versions;
#   * the shipped direct deps (httpx, mcp) ARE covered by Dependabot alerts
#     via pyproject; and
#   * for an urgent transitive CVE in a toolchain, dispatch this workflow
#     (workflow_dispatch) to refresh within minutes.
#
# Security model (two jobs on purpose):
#   * `validate` recompiles with --upgrade, UPLOADS the as-compiled locks as
#     an artifact, and ONLY THEN installs and runs the upgraded third-party
#     toolchains. Upload-before-execution means a compromised upgraded tool
#     cannot rewrite the locks that `open-pr` later commits. The job is
#     `contents: read` only, so its token cannot push regardless.
#   * `open-pr` runs only trusted code (git + gh) on that artifact (data, not
#     executable) and is the only job granted write scope.
#
# The upload-before-execution claim is only meaningful because
# scripts/regenerate-locks.sh compiles with --no-build, so resolution reads
# wheel metadata and executes no third-party code. That is enforced by the
# flag, not by convention: if a future dependency were sdist-only, the
# compile would fail rather than silently start running setup.py here. The
# one graph that genuinely needs source builds, constraints/mutation.lock, is
# excluded from this workflow for exactly that reason.
#
# Every refreshed lock is validated by its OWN consumer before `open-pr` runs.
# Validating only dev.lock would let a broken build/cyclonedx/mutmut upgrade
# merge and first surface during an actual release or a weekly mutation run,
# because release.yml and mutation.yml do not run on pull requests.

on:
  schedule:
    # 1st of each month, 13:00 UTC (~09:00 America/New_York). The toolchain
    # locks are low-urgency (CI/dev/release tooling); for an urgent CVE use
    # workflow_dispatch.
    - cron: "0 13 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-maintenance
  cancel-in-progress: false

jobs:
  validate:
    name: Compile & validate refreshed locks
    runs-on: ubuntu-latest
    permissions:
      contents: read  # read-only: untrusted upgraded code runs in this job
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Recompile the wheel-only constraints/ locks with --upgrade
        # Calls the same scripts/regenerate-locks.sh as the `lock` gate in
        # ci.yml, plus --upgrade, which advances every pin to the newest
        # version allowed by its input ranges instead of reusing the committed
        # pins as preferences. --upgrade is NOT recorded in the lock headers,
        # so the output stays byte-identical to what the CI `lock` gate
        # regenerates. uv comes from the hash-locked bootstrap file.
        #
        # The script compiles with --no-build, so this resolution reads wheel
        # metadata only and executes no third-party code. That is what makes
        # the upload-before-execution boundary below actually hold. The
        # sdist-only graph that would violate it (constraints/mutation.lock)
        # is not regenerated by this workflow at all.
        #
        # The compile still runs in a DISPOSABLE COPY of the tree, and the
        # checkout is asserted unmodified afterwards, as defence in depth: if
        # --no-build were ever dropped from the script, this contains the
        # damage and fails the job rather than silently letting build code
        # rewrite constraints/ before the upload.
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r constraints/uv-bootstrap.lock

          WORK="${RUNNER_TEMP}/lock-compile"
          mkdir -p "$WORK"
          git archive HEAD | tar -x -C "$WORK"

          ( cd "$WORK" && ./scripts/regenerate-locks.sh --upgrade )

          # Determinism gate, run in the same scratch tree and BEFORE the
          # upload: recompiling without --upgrade must be a no-op. If it is
          # not, the locks are not byte-reproducible and the CI `lock` gate
          # would fail on the resulting PR.
          cp -r "$WORK/constraints" "${RUNNER_TEMP}/constraints-upgraded"
          ( cd "$WORK" && ./scripts/regenerate-locks.sh )
          diff -r "${RUNNER_TEMP}/constraints-upgraded" "$WORK/constraints"
          echo "Regeneration is deterministic."

          # Resolution-time build code must not have touched the checkout.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The working tree was modified during lock compilation."
            git status --porcelain
            exit 1
          fi

          cp "$WORK"/constraints/*.lock constraints/

      - name: Realign .pre-commit-config.yaml with the refreshed dev.lock
        # .pre-commit-config.yaml promises its ruff/mypy/bandit revs and mypy
        # stub deps equal constraints/dev.lock. Staging only constraints/ would
        # break that promise every time this refresh bumps a linter. The script
        # is stdlib-only first-party code, so running it here — before the
        # upgraded toolchain executes — does not violate upload-before-exec.
        run: python scripts/check_precommit_lockstep.py --fix

      - name: Detect whether anything changed
        id: diff
        run: |
          if git diff --quiet constraints/ .pre-commit-config.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Locks already current — nothing to refresh."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat constraints/ .pre-commit-config.yaml
          fi

      - name: Upload the refreshed locks as compiled
        # Uploaded BEFORE any validate step below installs/runs the upgraded
        # toolchains, so a compromised tool cannot tamper with what `open-pr`
        # commits. open-pr consumes this artifact only if `validate` succeeds.
        # Nothing third-party has executed in this job at this point: the
        # compile is --no-build and the pre-commit realign is first-party
        # stdlib code.
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93e64a875d1fc6a0a  # v7.0.1
        with:
          name: refreshed-locks
          path: |
            constraints/
            .pre-commit-config.yaml
          # REQUIRED: .pre-commit-config.yaml is a dotfile, and this action
          # skips hidden files by default even when they are named
          # explicitly in `path`. Without this, open-pr would silently
          # commit the refreshed locks with the STALE config from its own
          # checkout, breaking the lockstep contract the refresh just
          # repaired.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Everything below installs and EXECUTES upgraded third-party code, so
      # it runs only after the upload above, under the read-only token.
      # Each lock is validated by the tool that actually consumes it, in its
      # own venv, so one toolchain cannot mask a break in another.
      # ---------------------------------------------------------------------

      - name: Validate dev.lock (lint / type / docstring / security gate)
        # Same quality gate as ci.yml's `lint`. Keep in sync with it.
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/v-dev"
          # Put the venv first on PATH so the commands below are plain
          # `python -m pip install ...`: that is what Scorecard's pinned-
          # dependency parser recognises, so these stay covered by the check.
          export PATH="${RUNNER_TEMP}/v-dev/bin:${PATH}"
          python -m pip install --require-hashes -r constraints/dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          ruff check .
          ruff format --check .
          mypy src/uniprot_mcp
          interrogate -c pyproject.toml src/uniprot_mcp
          bandit -r src/uniprot_mcp
          python -m pip freeze --exclude uniprot-mcp-server > "${RUNNER_TEMP}/audit-deps.txt"
          pip-audit --strict -r "${RUNNER_TEMP}/audit-deps.txt"

      - name: Validate test.lock (offline test suite)
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/v-test"
          # Put the venv first on PATH so the commands below are plain
          # `python -m pip install ...`: that is what Scorecard's pinned-
          # dependency parser recognises, so these stay covered by the check.
          export PATH="${RUNNER_TEMP}/v-test/bin:${PATH}"
          python -m pip install --require-hashes -r constraints/test.lock
          python -m pip install --no-build-isolation --no-deps -e .
          pytest tests/unit tests/property tests/client tests/contract -q

      - name: Validate docs.lock (mkdocs strict build)
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/v-docs"
          # Put the venv first on PATH so the commands below are plain
          # `python -m pip install ...`: that is what Scorecard's pinned-
          # dependency parser recognises, so these stay covered by the check.
          export PATH="${RUNNER_TEMP}/v-docs/bin:${PATH}"
          python -m pip install --require-hashes -r constraints/docs.lock
          python -m pip install --no-build-isolation --no-deps -e .
          mkdocs build --strict

      - name: Validate release.lock (no-isolation build + SBOM smoke test)
        # release.yml runs only on tags/dispatch, so without this a broken
        # build or cyclonedx-bom upgrade would first surface during an actual
        # release. Publishing is not involved: this only builds locally.
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/v-rel"
          # Put the venv first on PATH so the commands below are plain
          # `python -m pip install ...`: that is what Scorecard's pinned-
          # dependency parser recognises, so these stay covered by the check.
          export PATH="${RUNNER_TEMP}/v-rel/bin:${PATH}"
          python -m pip install --require-hashes -r constraints/release.lock
          rm -rf "${RUNNER_TEMP}/dist-smoke"
          python -m build --no-isolation --outdir "${RUNNER_TEMP}/dist-smoke"
          python -m pip freeze > "${RUNNER_TEMP}/rel-freeze.txt"
          cyclonedx-py requirements -o "${RUNNER_TEMP}/sbom.json" "${RUNNER_TEMP}/rel-freeze.txt"
          test -s "${RUNNER_TEMP}/sbom.json"
          ls -1 "${RUNNER_TEMP}/dist-smoke"

      - name: Validate mutation-build.lock against the committed mutation.lock
        # mutation.lock itself is NOT refreshed by this workflow, but
        # mutation-build.lock IS, and that is the setuptools/wheel pair used to
        # build mutmut and glob2 from source at install time. A bad bump there
        # breaks the mutation toolchain just as surely as a bad mutmut bump.
        # mutation.yml is schedule/manual-only, so without this check the
        # breakage would first surface during a weekly mutation run.
        #
        # Installs the committed mutation.lock using the REFRESHED
        # mutation-build.lock and asserts the pin and the parse_run_argument
        # seam that scripts/mutmut_shard.py monkeypatches both still hold.
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/v-mut"
          # Put the venv first on PATH so the commands below are plain
          # `python -m pip install ...`: that is what Scorecard's pinned-
          # dependency parser recognises, so these stay covered by the check.
          export PATH="${RUNNER_TEMP}/v-mut/bin:${PATH}"
          # mutation-build.lock first, then --no-build-isolation: mutmut and
          # glob2 are sdist-only, so pip builds them, and plain
          # --require-hashes would fetch the setuptools backend unhashed.
          python -m pip install --require-hashes -r constraints/mutation-build.lock
          python -m pip install --no-build-isolation --require-hashes -r constraints/mutation.lock
          python - <<'PY'
          import importlib.metadata as md

          import mutmut.__main__ as mm

          version = md.version("mutmut")
          assert version == "2.5.1", f"mutation.in must keep mutmut at 2.5.1, got {version}"
          assert hasattr(mm, "parse_run_argument"), (
              "mutmut.__main__.parse_run_argument is gone; scripts/mutmut_shard.py "
              "monkeypatches it and will break"
          )
          print(f"mutmut {version}: parse_run_argument seam present")
          PY

  open-pr:
    name: Open or update the refresh PR
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the chore/dev-lock-refresh branch
      pull-requests: write  # open/update the refresh PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A PAT (if set) makes the PR trigger CI; otherwise the workflow token,
          # in which case the `validate` job is the validation of record. The
          # token is persisted so the git push below authenticates.
          token: ${{ secrets.LOCK_PR_TOKEN || github.token }}

      - name: Download the refreshed locks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: refreshed-locks
          path: .

      - name: Open or update the refresh PR
        env:
          GH_TOKEN: ${{ secrets.LOCK_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          BRANCH=chore/dev-lock-refresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add constraints/ .pre-commit-config.yaml
          if git diff --cached --quiet; then
            echo "main already carries this refresh; nothing to commit."
            exit 0
          fi
          git commit -m "chore(deps): refresh hash-locked toolchains to latest compatible pins"
          # Bot-owned branch; force keeps an existing PR updated in place rather
          # than spawning a new one each month.
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            echo "PR already open for $BRANCH; the force-push updated it."
            exit 0
          fi
          cat > "${RUNNER_TEMP}/pr-body.md" <<'BODY'
          Automated refresh of every hash-locked toolchain under `constraints/` via `uv pip compile --upgrade`.

          Covers `dev.lock`, `test.lock`, `docs.lock`, `release.lock` and `mutation-build.lock` — every lock whose graph resolves purely from wheels.

          Two locks are deliberately excluded. `uv-bootstrap.lock` pins the uv that compiles the others, so bumping it is a separate reviewable commit against `constraints/uv.in`. `mutation.lock` is sdist-only (mutmut, glob2), so resolving it executes third-party `setup.py` code; it is regenerated by hand via `scripts/regenerate-mutation-lock.sh`. Keeping it out is what lets this workflow compile with `--no-build` and upload the locks before any third-party code runs.

          `.pre-commit-config.yaml` is realigned in the same commit, so the local hook revs keep matching the refreshed `dev.lock`.

          Each refreshed lock was validated by its own consumer in the read-only `validate` job, in a separate environment, before this PR was opened:

          | Lock | Validated with |
          | --- | --- |
          | `dev.lock` | ruff, mypy, interrogate, bandit, pip-audit |
          | `test.lock` | offline unit / property / client / contract suite |
          | `docs.lock` | `mkdocs build --strict` |
          | `release.lock` | `python -m build --no-isolation` + CycloneDX SBOM |
          | `mutation-build.lock` | building the committed `mutation.lock` from sdists, then the mutmut pin and the `parse_run_argument` shard seam |

          Regeneration was also proven deterministic: recompiling without `--upgrade` reproduced the same bytes.

          This is the batched home for transitive-dependency updates now that Dependabot is scoped to direct deps. Review the diff, confirm checks, and merge.

          Note: if this PR shows no CI checks, it was opened with GITHUB_TOKEN, which cannot trigger workflow runs. Close and reopen it to run CI, or add a LOCK_PR_TOKEN repo secret (a fine-grained PAT with contents + pull-requests write) to have CI trigger automatically.
          BODY
          gh pr create --base main --head "$BRANCH" --draft \
            --title "chore(deps): refresh hash-locked toolchains" \
            --body-file "${RUNNER_TEMP}/pr-body.md"
