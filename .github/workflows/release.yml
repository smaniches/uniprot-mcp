name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  # Programmatic / manual trigger. release-please.yml dispatches this after it
  # creates a release, because a GITHUB_TOKEN-authored release event does not
  # fan out to other workflows. The old `push: tags: v[0-9]*` path above stays
  # as a working fallback for a manually pushed tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and publish (e.g. v1.2.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # SLSA provenance OIDC
      attestations: write   # actions/attest-build-provenance + attest-sbom
    outputs:
      sbom: ${{ steps.sbom.outputs.path }}
    steps:
      # Guard against an accidental manual dispatch with a blank tag. The
      # release-please dispatch ALWAYS passes --field tag, so this only
      # fires on manual misuse. Without it, a blank tag would fall back to
      # building github.ref (the branch) and then call action-gh-release
      # with an empty tag_name. Fail fast before anything is built or
      # published. The push:tags fallback (event_name == 'push') is
      # unaffected - it never reads inputs.tag.
      - name: Require a tag on manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
        run: |
          echo "::error::workflow_dispatch requires a non-empty 'tag' input (e.g. v1.2.0)."
          echo "Push a tag (refs/tags/v*) for the fallback path, or supply the tag input."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Build the exact released tag when dispatched by release-please, so
          # the wheel reflects the released commit rather than main HEAD. On
          # the push-tag fallback, inputs.tag is empty and github.ref is the
          # tag ref, so the same checkout is correct either way.
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        # build, cyclonedx-bom and the hatchling build backend produce the
        # released wheel and the SBOM that is attested below, so they are
        # the highest-value targets in this workflow. All of them, and
        # their full transitive graph, are installed from
        # constraints/release.lock under --require-hashes: a substituted
        # artifact on the index cannot reach the build.
        #
        # The backend is in the lock because `python -m build` isolates by
        # default, which would otherwise download and execute an unhashed
        # hatchling inside the job that holds OIDC publish rights and
        # signs the attestations. constraints/build.in supplies it; the
        # build step below runs --no-isolation to use it.
        #
        # Regenerate with scripts/regenerate-locks.sh after editing
        # constraints/release.in or constraints/build.in.
        run: |
          python -m pip install --require-hashes -r constraints/release.lock
      - name: Build sdist + wheel
        # --no-isolation: use the hash-verified hatchling installed above
        # instead of letting build fetch its own copy from the index.
        run: python -m build --no-isolation
      - name: Generate CycloneDX SBOM from exact release wheel
        id: sbom
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::expected exactly one release wheel, found ${#wheels[@]}"
            exit 1
          fi
          wheel="${wheels[0]}"

          # Keep the analyzed runtime clean: pip/cyclonedx/build tooling stay in
          # the host environment. pip's --python option installs the exact wheel
          # and its resolved runtime dependencies into a venv created without pip.
          python -m venv --without-pip .sbom-runtime
          python -m pip --python .sbom-runtime install "$wheel"

          # CycloneDX inspects the installed runtime environment; pyproject.toml
          # supplies metadata.component. The binder then verifies Name/Version
          # against wheel METADATA and records SHA-256(exact wheel) on that root.
          cyclonedx-py environment .sbom-runtime/bin/python \
            --pyproject pyproject.toml \
            --mc-type library \
            --output-reproducible \
            --output-format JSON \
            --output-file sbom.cdx.json
          python scripts/bind_release_sbom.py --sbom sbom.cdx.json --wheel "$wheel"
          python scripts/bind_release_sbom.py --verify-only --sbom sbom.cdx.json --wheel "$wheel"
          echo "path=sbom.cdx.json" >> "$GITHUB_OUTPUT"
      - name: SLSA provenance attestation (dist)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: "dist/*"
      - name: SBOM attestation (exact wheel)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-path: "dist/*.whl"
          sbom-path: "sbom.cdx.json"
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/*
            sbom.cdx.json

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # PyPI Trusted Publishing OIDC
    environment:
      name: pypi
      url: https://pypi.org/project/uniprot-mcp-server/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifacts
          path: .
      - name: Publish to PyPI (Trusted Publishing, OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          packages-dir: dist
          print-hash: true

  sign-and-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create GitHub Release
      id-token: write       # Sigstore signing OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifacts
          path: .
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: |
            dist/*.tar.gz
            dist/*.whl
      # On the release-please dispatch path (workflow_dispatch with a tag),
      # release-please has ALREADY created the GitHub Release and owns its
      # curated, conventional-commit changelog body. We therefore target that
      # existing release by tag and DO NOT regenerate notes - we only attach
      # the build artifacts, SBOM, and Sigstore bundles to it. On the
      # push-tag fallback (no inputs.tag), no release exists yet, so we create
      # one with auto-generated notes as before.
      - name: Attach artifacts to release-please release (dispatch path)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: false
          files: |
            dist/*
            sbom.cdx.json
            *.sigstore.json
      - name: Create GitHub Release (push-tag fallback path)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/*
            sbom.cdx.json
            *.sigstore.json

  publish-mcp-registry:
    # Publish server.json to the official MCP Registry
    # (registry.modelcontextprotocol.io) so the public listing tracks every
    # release automatically - closing the last manual link in the chain.
    #
    # Ordering: runs AFTER publish-pypi because the registry's
    # package-ownership check reads the just-published PyPI release. Ownership
    # is proven two ways, no secret/PAT required:
    #   - package: the ``mcp-name: io.github.smaniches/uniprot-mcp`` marker in
    #     README.md (which is the PyPI long description).
    #   - namespace ``io.github.smaniches``: GitHub OIDC (id-token below).
    # server.json already carries the released version (release-please bumps
    # it via extra-files), so no version rewrite step is needed.
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # GitHub OIDC -> MCP Registry (io.github.* namespace)
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install authenticated mcp-publisher
        run: bash scripts/install_mcp_publisher.sh
      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json to MCP Registry
        run: ./mcp-publisher publish

  # Chain release verification AFTER publish + signing have completed, so
  # release-verify reads PyPI / GitHub Release assets / Sigstore bundles
  # that actually exist. This replaces the previous parallel dispatch from
  # release-please.yml, which could race the build and open false
  # `release-drift` failures before the assets were attached.
  #
  # This also covers the push-tag fallback path: a release created by
  # release.yml under GITHUB_TOKEN does not fan out to release-verify's
  # native `release: published` trigger, so without this explicit dispatch
  # the fallback path would never be verified.
  dispatch-verify:
    needs: [publish-pypi, sign-and-release]
    runs-on: ubuntu-latest
    permissions:
      actions: write        # gh workflow run (workflow_dispatch)
    steps:
      - name: Dispatch release verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On the dispatch path inputs.tag is the released tag; on the
          # push-tag fallback inputs.tag is empty and github.ref_name is
          # the tag. release-verify's `tag` input is required, so this must
          # always resolve to a non-empty value.
          VERIFY_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh workflow run release-verify.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$VERIFY_TAG" \
            --field tag="$VERIFY_TAG"
